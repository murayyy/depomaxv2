<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0F52BA" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Paletleme — Depomax</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  .pl-liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .pl-kart { background: var(--color-surface-1, #fff); border: 1px solid var(--color-border, #e2e8f0); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .pl-kart.devam { border-left: 5px solid #a259d9; }
  .pl-kart.hazir { border-left: 5px solid #3b82f6; }
  .pl-kart.bitti { border-left: 5px solid #22b066; }
  .pl-sube { font-size: 20px; font-weight: 700; line-height: 1.15; }
  .pl-alt { font-size: 13px; color: var(--color-ink-soft, #64748b); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .pl-sure { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 18px; }
  .pl-yard { display: flex; flex-direction: column; gap: 6px; }
  .pl-yard-satir { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--color-surface-2, #f1f5f9); border-radius: 8px; padding: 6px 10px; font-size: 14px; }
  .pl-yard-satir.cikti { opacity: .55; }
  .pl-btnlar { display: flex; gap: 8px; flex-wrap: wrap; }
  .pl-btnlar .btn { flex: 1; min-height: 48px; font-size: 15px; }
  .pl-baslik { font-size: 15px; font-weight: 700; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
  .pl-baslik em { font-style: normal; background: var(--color-surface-2, #f1f5f9); border-radius: 20px; padding: 0 10px; font-size: 13px; }
  .pl-sayi { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pl-sayi input { font-size: 28px; text-align: center; min-height: 64px; font-weight: 700; }
  .pl-toplam { text-align: center; font-size: 18px; margin: 6px 0; }
  .pl-bos { color: var(--color-ink-soft, #64748b); font-size: 14px; padding: 8px 0; }
  .etiket { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 6px; color: #fff; margin-left: 6px; vertical-align: 2px; }
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="topbar__brand"><span class="topbar__mark">D</span> Depomax</div>
    <nav class="topbar__nav" id="topNav">
      <a class="topbar__link is-active" href="paletci.html">📦 Paletleme</a>
      <a class="topbar__link" href="canli.html">🔴 Canlı</a>
    </nav>
    <div class="topbar__user">
      <span class="role-chip" id="rolEtiketi">…</span>
      <span id="kullaniciAdi">…</span>
      <button class="btn btn-ghost btn-sm" id="cikisBtn">Çıkış</button>
    </div>
  </header>

  <main class="page">
    <div class="page__header">
      <div>
        <div class="page__title">Paletleme</div>
        <div class="page__subtitle">Kontrolüne başlanmış şubeye "Başladım" deyin, yardımcı ekleyin, bitince palet sayısını girin.</div>
      </div>
    </div>

    <div class="pl-baslik">🟣 Paletlemesi süren <em id="sayDevam">0</em></div>
    <div class="pl-liste" id="listeDevam"></div>

    <div class="pl-baslik">🔵 Paletlemeye hazır (kontrole başlandı) <em id="sayHazir">0</em></div>
    <div class="pl-liste" id="listeHazir"></div>

    <div class="pl-baslik">🟢 Bugün biten <em id="sayBitti">0</em></div>
    <div class="pl-liste" id="listeBitti"></div>
  </main>
</div>
<div id="modalRoot"></div>
<script type="module" src="js/paletci.js?v=20261127"></script>
</body>
</html>
