<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0F52BA" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Şube — Depomax</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="topbar__brand"><span class="topbar__mark">D</span> Depomax</div>
    <nav class="topbar__nav">
      <button class="topbar__link is-active" data-sekme="siparis">🛒 Sipariş Ver</button>
      <button class="topbar__link" data-sekme="gecmis">📋 Siparişlerim <span id="gecmisSayac" style="font-size:11px;color:var(--color-ink-soft);"></span></button>
    </nav>
    <div class="topbar__user">
      <span class="role-chip" id="rolEtiketi">…</span>
      <span id="kullaniciAdi">…</span>
      <button class="btn btn-ghost btn-sm" id="cikisBtn">Çıkış</button>
    </div>
  </header>

  <main class="page">

    <!-- ============ SİPARİŞ VER ============ -->
    <div id="siparisBloku">
      <div class="page__header">
        <div>
          <div class="page__title">Sipariş Ver</div>
          <div class="page__subtitle">Miktarları girin, boş bıraktıklarınız eklenmez.</div>
        </div>
        <div class="toolbar__group">
          <label class="btn btn-ghost" style="cursor:pointer;">
            📄 Excel'den Yükle
            <input type="file" id="excelYukleInput" accept=".xlsx,.xls,.csv" class="u-hidden" />
          </label>
          <button class="btn btn-ghost" id="katalogDisiEkleBtn">+ Katalog Dışı</button>
          <button class="btn btn-primary" id="siparisGonderBtn" disabled>Siparişi Gönder</button>
        </div>
      </div>

      <div class="toolbar" style="margin-bottom:14px;gap:8px;flex-wrap:wrap;">
        <input class="input" id="urunAraInput" placeholder="🔍 Ürün ara…" style="max-width:220px;" autocomplete="off" />
        <select class="select" id="kategoriFiltre" style="max-width:200px;">
          <option value="">Tüm Kategoriler</option>
        </select>
        <select class="select" id="siralamaFiltre" style="max-width:180px;">
          <option value="sira">Sıra No</option>
          <option value="kod">Stok Koduna Göre</option>
          <option value="ad">Ürün Adına Göre</option>
        </select>
      </div>

      <div id="yukleniyorAlani" class="empty-state">
        <div class="empty-state__icon">⏳</div>
        <div class="empty-state__title">Katalog yükleniyor…</div>
      </div>
      <div id="bosKatalog" class="empty-state u-hidden">
        <div class="empty-state__icon">📦</div>
        <div class="empty-state__title">Katalog henüz boş</div>
      </div>
      <div id="katalogAlani" class="u-hidden">
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Stok Kodu</th><th>Ürün Adı</th><th>Birim</th><th>Min.</th><th>Miktar</th><th>Not</th></tr></thead>
            <tbody id="katalogGovde"></tbody>
          </table>
        </div>
        <div class="row-cards" id="katalogKartlar"></div>
      </div>

      <div id="ozelKalemlerAlani" class="u-hidden" style="margin-top:20px;">
        <div style="font-weight:700;font-size:13px;margin-bottom:8px;">🟠 Katalog Dışı Talepler</div>
        <div id="ozelKalemlerListe"></div>
      </div>
    </div>

    <!-- ============ SİPARİŞLERİM ============ -->
    <div id="gecmisBloku" class="u-hidden">
      <div class="page__header">
        <div class="page__title">Siparişlerim</div>
      </div>
      <div id="gecmisListesi"></div>
    </div>

  </main>
</div>
<div id="modalRoot"></div>
<script type="module" src="js/sube-combined.js"></script>
</body>
</html>
