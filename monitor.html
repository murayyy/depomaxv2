<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Depo Monitör</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: #0f172a; color: #f1f5f9; min-height: 100vh; }
  .header { background: #1e293b; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
  .logo { font-size: 22px; font-weight: 800; color: #60a5fa; letter-spacing: -0.5px; }
  .saat { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; color: #94a3b8; }
  .ozet-bar { display: flex; gap: 0; border-bottom: 1px solid #334155; }
  .ozet-item { flex: 1; padding: 14px 20px; text-align: center; border-right: 1px solid #334155; }
  .ozet-item:last-child { border-right: none; }
  .ozet-sayi { font-size: 36px; font-weight: 800; }
  .ozet-etiket { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; padding: 20px; }
  .kart { background: #1e293b; border-radius: 12px; padding: 20px; border-left: 5px solid #3b82f6; position: relative; }
  .kart.acil { border-left-color: #f59e0b; }
  .kart.cok-acil { border-left-color: #ef4444; animation: yanip 2s infinite; }
  .kart.kontrol { border-left-color: #8b5cf6; }
  .kart.bekliyor { border-left-color: #475569; opacity: .7; }
  @keyframes yanip { 0%,100%{border-left-color:#ef4444} 50%{border-left-color:#fca5a5} }
  .kart-ust { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .kart-ad { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .kart-durum { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
  .dur-toplaniyor { background: #1d4ed8; color: #bfdbfe; }
  .dur-kontrol { background: #5b21b6; color: #ddd6fe; }
  .dur-bekliyor { background: #334155; color: #94a3b8; }
  .kart-personel { font-size: 15px; color: #94a3b8; margin-bottom: 12px; }
  .progress { height: 10px; background: #334155; border-radius: 5px; overflow: hidden; margin-bottom: 6px; }
  .progress-fill { height: 100%; border-radius: 5px; transition: width .5s; }
  .fill-blue { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
  .fill-purple { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
  .kart-alt { display: flex; justify-content: space-between; font-size: 13px; color: #64748b; }
  .yuzde { font-size: 20px; font-weight: 800; color: #f1f5f9; }
  .alan-rozet { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  .bos { text-align: center; padding: 80px 20px; color: #475569; }
  .bos-ikon { font-size: 64px; margin-bottom: 16px; }
  .bos-yazi { font-size: 24px; font-weight: 600; }
  .tam-ekran { position: fixed; bottom: 16px; right: 16px; background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">🏭 Depomax · Depo Monitörü</div>
  <div style="display:flex;gap:24px;align-items:center;">
    <div id="guncelleme" style="font-size:13px;color:#475569;">Yükleniyor…</div>
    <div class="saat" id="saat">--:--:--</div>
  </div>
</div>

<div class="ozet-bar">
  <div class="ozet-item"><div class="ozet-sayi" id="ozToplaniyor" style="color:#60a5fa;">—</div><div class="ozet-etiket">Toplanıyor</div></div>
  <div class="ozet-item"><div class="ozet-sayi" id="ozKontrol" style="color:#a78bfa;">—</div><div class="ozet-etiket">Kontrol</div></div>
  <div class="ozet-item"><div class="ozet-sayi" id="ozBekliyor" style="color:#94a3b8;">—</div><div class="ozet-etiket">Bekliyor</div></div>
  <div class="ozet-item"><div class="ozet-sayi" id="ozToplam" style="color:#34d399;">—</div><div class="ozet-etiket">Bugün Toplam</div></div>
</div>

<div id="gridAlani"><div class="bos"><div class="bos-ikon">✅</div><div class="bos-yazi">Aktif sipariş yok</div></div></div>

<button class="tam-ekran" onclick="document.documentElement.requestFullscreen()">⛶ Tam Ekran</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore as _gf, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./js/firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// Auth koruması — sadece admin/kontrolör/toplayıcı görebilir
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = "index.html"; return; }
  const snap = await getDoc(doc(db, "kullanicilar", user.uid));
  const rol = snap.exists() ? snap.data().rol : null;
  if (!["admin", "kontrolor", "toplayici", "depocu"].includes(rol)) {
    window.location.href = "index.html?hata=yetkisiz"; return;
  }
  // Auth tamam — başlat
  guncelle();
  setInterval(guncelle, 30000);
  setInterval(() => {
    document.querySelectorAll(".sure-sayac[data-bas]").forEach(el => {
      el.textContent = gecenSure(el.dataset.bas);
    });
  }, 1000);
});

// Saat
setInterval(() => {
  document.getElementById("saat").textContent = new Date().toLocaleTimeString("tr-TR");
}, 1000);

function gecenSure(isoStr) {
  if (!isoStr) return "";
  const sn = Math.floor((Date.now() - new Date(isoStr)) / 1000);
  if (sn < 60) return `${sn}sn`;
  const dk = Math.floor(sn / 60);
  if (dk < 60) return `${dk}dk`;
  return `${Math.floor(dk/60)}s ${dk%60}dk`;
}

async function guncelle() {
  try {
    const snap = await getDocs(query(
      collection(db, "siparisler"),
      where("durum", "in", ["toplaniyor", "toplandi", "kontrol_ediliyor"])
    ));
    const siparisler = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    const toplaniyor = siparisler.filter(s => s.durum === "toplaniyor");
    const kontrol = siparisler.filter(s => s.durum === "kontrol_ediliyor");
    const bekliyor = siparisler.filter(s => s.durum === "toplandi");

    document.getElementById("ozToplaniyor").textContent = toplaniyor.length;
    document.getElementById("ozKontrol").textContent = kontrol.length;
    document.getElementById("ozBekliyor").textContent = bekliyor.length;
    document.getElementById("ozToplam").textContent = siparisler.length;
    document.getElementById("guncelleme").textContent = `Güncellendi: ${new Date().toLocaleTimeString("tr-TR")}`;

    if (!siparisler.length) {
      document.getElementById("gridAlani").innerHTML = `<div class="bos"><div class="bos-ikon">✅</div><div class="bos-yazi">Aktif sipariş yok</div></div>`;
      return;
    }

    // Sıralama: çok acil → acil → normal
    const acilSira = { cok_acil: 0, acil: 1, normal: 2 };
    const sirali = [...toplaniyor, ...kontrol, ...bekliyor].sort((a, b) =>
      (acilSira[a.aciliyet] ?? 2) - (acilSira[b.aciliyet] ?? 2)
    );

    document.getElementById("gridAlani").innerHTML = `<div class="grid">${sirali.map(s => {
      const toplanan = Number(s.toplananUrun) || 0;
      const toplam = Number(s.toplamUrun) || 1;
      const yuzde = Math.round((toplanan / toplam) * 100);
      const acil = s.aciliyet === "cok_acil" ? "cok-acil" : s.aciliyet === "acil" ? "acil" : "";
      let durumSinif = "dur-toplaniyor", durumMetni = "📦 Toplanıyor", kartSinif = acil;
      if (s.durum === "kontrol_ediliyor") { durumSinif = "dur-kontrol"; durumMetni = "✅ Kontrol"; kartSinif = "kontrol"; }
      if (s.durum === "toplandi") { durumSinif = "dur-bekliyor"; durumMetni = "⏳ Bekliyor"; kartSinif = "bekliyor"; }
      const fillSinif = s.durum === "kontrol_ediliyor" ? "fill-purple" : "fill-blue";
      const personel = s.toplayanKullanici || s.toplamayiTamamlayan || s.kontrolTamamlayan || "";
      const baslangic = s.toplamaBaslangic || s.kontrolBaslangic || "";
      const acilEtiket = s.aciliyet === "cok_acil" ? "🔴 ÇOK ACİL" : s.aciliyet === "acil" ? "⚡ ACİL" : "";
      return `<div class="kart ${kartSinif}">
        ${acilEtiket ? `<div style="font-size:13px;font-weight:800;color:${s.aciliyet==="cok_acil"?"#ef4444":"#f59e0b"};margin-bottom:6px;">${acilEtiket}</div>` : ""}
        ${s.alanAdi ? `<div class="alan-rozet" style="background:#1e40af22;color:#60a5fa;">📍 ${s.alanAdi}</div>` : ""}
        <div class="kart-ust">
          <div class="kart-ad">${s.ad || s.subeAdi || "—"}</div>
          <span class="kart-durum ${durumSinif}">${durumMetni}</span>
        </div>
        ${personel ? `<div class="kart-personel">👤 ${personel}${baslangic ? ` · <span class="sure-sayac" data-bas="${baslangic}">${gecenSure(baslangic)}</span>` : ""}</div>` : ""}
        <div class="progress"><div class="progress-fill ${fillSinif}" style="width:${yuzde}%"></div></div>
        <div class="kart-alt">
          <span>${toplanan} / ${toplam} ürün${s.toplamKg ? " · " + Math.round(s.toplamKg) + " KG" : ""}</span>
          <span class="yuzde">%${yuzde}</span>
        </div>
        ${s.eksikUrun > 0 ? `<div style="font-size:13px;color:#f87171;margin-top:8px;">⚠ ${s.eksikUrun} eksik</div>` : ""}
      </div>`;
    }).join("")}</div>`;
  } catch(e) { console.error(e); }
}


</script>
</body>
</html>
